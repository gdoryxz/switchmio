name: Build switchmio NRO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20250728
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build .nro
        run: make

      - name: Upload built NRO
        uses: actions/upload-artifact@v4
        with:
          name: switchmio-nro
          path: "*.nro"
